name: Signed Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify release tag
        shell: bash
        run: |
          APP_VERSION="$(sed -nE 's/^[[:space:]]*versionName = "([0-9]+\\.[0-9]+\\.[0-9]+)".*/\\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_CODE="$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$APP_VERSION" && test -n "$VERSION_CODE" || {
            echo "::error::Unable to read numeric versionName/versionCode from app/build.gradle.kts"
            exit 1
          }
          MAJOR_VERSION="${APP_VERSION%%.*}"
          test "$MAJOR_VERSION" -ge 5 && test "$VERSION_CODE" -ge 50000 || {
            echo "::error::Only MolidoVPN version 5.0.0 and later may be released."
            exit 1
          }
          test "${GITHUB_REF_NAME}" = "v${APP_VERSION}" || {
            echo "::error::Tag must exactly match app version v${APP_VERSION}; refusing ${GITHUB_REF_NAME}"
            exit 1
          }
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Release tags must point to a commit already merged into main"
            exit 1
          }

      - name: Require existing owner signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing ANDROID_KEY_PASSWORD"; exit 1; }
          mkdir -p "$RUNNER_TEMP/molido-signing"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/molido-signing/release.keystore"
          test -s "$RUNNER_TEMP/molido-signing/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/molido-signing/release.keystore" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace

      # Compile instrumentation sources only. Never assemble or distribute a test APK.
      - name: Compile Android instrumentation test sources (no APK)
        run: ./gradlew compileDebugAndroidTestKotlin --stacktrace

      # This owner attestation must be added only after signing-key exposure remediation.
      - name: Require remediated and verified release signing identity
        shell: bash
        env:
          ANDROID_RELEASE_KEY_STATUS: ${{ secrets.ANDROID_RELEASE_KEY_STATUS }}
          ANDROID_RELEASE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          test "$ANDROID_RELEASE_KEY_STATUS" = "REMEDIATED_AND_VERIFIED" || {
            echo "::error::Release signing identity has not been owner-attested as remediated and verified."
            exit 1
          }
          printf '%s' "$ANDROID_RELEASE_CERT_SHA256" | grep -Eq '^[A-Fa-f0-9:]{64,95}$' || {
            echo "::error::Missing or invalid pinned release certificate SHA-256 fingerprint."
            exit 1
          }

      - name: Build signed final release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk "release-output/MolidoVPN-v${APP_VERSION}.apk"

      - name: Verify APK signature, pinned certificate and checksum
        shell: bash
        env:
          ANDROID_RELEASE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          APK="release-output/MolidoVPN-v${APP_VERSION}.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          CERT_INFO="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          printf '%s\n' "$CERT_INFO"
          ACTUAL_CERT_SHA256="$(printf '%s\n' "$CERT_INFO" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_CERT_SHA256="$(printf '%s' "$ANDROID_RELEASE_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test -n "$ACTUAL_CERT_SHA256" && test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256" || {
            echo "::error::APK signer certificate does not match the owner-pinned release fingerprint."
            exit 1
          }
          sha256sum "$APK" > release-output/SHA256SUMS.txt
          keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Publish final GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-output/MolidoVPN-v${{ env.APP_VERSION }}.apk
            release-output/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
