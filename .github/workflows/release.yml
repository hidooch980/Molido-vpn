name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Release and Debug APKs
        run: |
          ./gradlew assembleRelease assembleDebug --stacktrace
          TAG_NAME=${GITHUB_REF_NAME:-v0.3.0}
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "MolidoVPN-${TAG_NAME}.apk"
            cp app/build/outputs/apk/release/app-release.apk MolidoVPN.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk "MolidoVPN-${TAG_NAME}.apk"
            cp app/build/outputs/apk/debug/app-debug.apk MolidoVPN.apk
          fi

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            MolidoVPN-*.apk
            MolidoVPN.apk
          generate_release_notes: true
          draft: false
          prerelease: false
