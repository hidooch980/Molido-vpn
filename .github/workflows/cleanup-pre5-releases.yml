name: Remove pre-5.0.0 releases and tags

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DELETE_PRE_5_RELEASES_AND_TAGS to confirm destructive cleanup'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: pre5-release-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Validate destructive cleanup confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          test "$CONFIRM" = "DELETE_PRE_5_RELEASES_AND_TAGS" || {
            echo "::error::Exact destructive-cleanup confirmation was not supplied."
            exit 1
          }

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove releases and tags below major version 5
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

          mapfile -t TAGS < <(
            git ls-remote --tags --refs origin 'refs/tags/v*' |
              awk '{sub("refs/tags/", "", $2); print $2}' |
              sort -u
          )

          for tag in "${TAGS[@]}"; do
            if [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              major="${BASH_REMATCH[1]}"
              if (( major < 5 )); then
                echo "Removing pre-5 release/tag: $tag"
                if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                  gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
                fi
                if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
                  gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag"
                fi
              fi
            fi
          done

          echo "Remaining release inventory:"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000
          echo "Remaining version tags:"
          git ls-remote --tags --refs origin 'refs/tags/v*' | awk '{sub("refs/tags/", "", $2); print $2}' | sort -u

