name: Gated signed Android release

on:
  workflow_dispatch:
    inputs:
      device_acceptance_passed:
        description: Confirm physical-device VPN acceptance tests passed
        required: true
        type: boolean
        default: false
      previous_application_id:
        description: Exact applicationId from the last official MolidoVPN release
        required: true
        type: string
      previous_version_code:
        description: versionCode from the last official MolidoVPN release
        required: true
        type: number
      release_version_code:
        description: New versionCode (must be greater than the previous release)
        required: true
        type: number
      release_version_name:
        description: New user-visible versionName
        required: true
        type: string

permissions:
  contents: write

jobs:
  signed-release:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      EXPECTED_CERT_SHA256: f0810e716f1e6180edca9bef7a4cf452062317445c82c40e939b743f7dc24fa7
      EXPECTED_APPLICATION_ID: ${{ inputs.previous_application_id }}
      PREVIOUS_VERSION_CODE: ${{ inputs.previous_version_code }}
      RELEASE_VERSION_CODE: ${{ inputs.release_version_code }}
      RELEASE_VERSION_NAME: ${{ inputs.release_version_name }}
      DEVICE_ACCEPTANCE_PASSED: ${{ inputs.device_acceptance_passed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Enforce release gates and restore the existing owner keystore
        shell: bash
        run: |
          set -euo pipefail
          test "$DEVICE_ACCEPTANCE_PASSED" = "true" || { echo "Physical-device acceptance was not confirmed; release blocked."; exit 1; }
          test -n "$EXPECTED_APPLICATION_ID" || { echo "Previous applicationId is required."; exit 1; }
          test "$RELEASE_VERSION_CODE" -gt "$PREVIOUS_VERSION_CODE" || { echo "New versionCode must exceed the previous official release."; exit 1; }
          test -n "$RELEASE_VERSION_NAME" || { echo "Release versionName is required."; exit 1; }
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Existing keystore secret is missing."; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Keystore password secret is missing."; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Key alias secret is missing."; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Key password secret is missing."; exit 1; }

          KEYSTORE_PATH="$RUNNER_TEMP/molido-owner-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

          ACTUAL_CERT_SHA256="$(keytool -exportcert -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | openssl dgst -sha256 -binary | xxd -p -c 256)"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256" || {
            echo "Signing certificate does not match the previously approved MolidoVPN certificate; release blocked."
            exit 1
          }

      - name: Run tests, lint, and build the signed release
        run: |
          ./gradlew testDebugUnitTest lint assembleRelease \
            -PreleaseApplicationId="$EXPECTED_APPLICATION_ID" \
            -PreleaseVersionCode="$RELEASE_VERSION_CODE" \
            -PreleaseVersionName="$RELEASE_VERSION_NAME" \
            --stacktrace

      - name: Verify APK package, version, and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer | head -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKANALYZER"
          test -n "$APKSIGNER"

          PACKAGE_ID="$("$APKANALYZER" manifest application-id "$APK")"
          VERSION_CODE="$("$APKANALYZER" manifest version-code "$APK")"
          test "$PACKAGE_ID" = "$EXPECTED_APPLICATION_ID"
          test "$VERSION_CODE" = "$RELEASE_VERSION_CODE"

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apk-signature.txt"
          APK_CERT_SHA256="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {gsub(":", "", $2); print tolower($2); exit}' "$RUNNER_TEMP/apk-signature.txt")"
          test "$APK_CERT_SHA256" = "$EXPECTED_CERT_SHA256" || {
            echo "Signed APK certificate mismatch; artifact will not be published."
            exit 1
          }

      - name: Publish only the verified final APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MolidoVPN-AI-final-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified APK for the in-app updater
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION_CODE }}
          name: MolidoVPN AI ${{ env.RELEASE_VERSION_NAME }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
